<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TapDay</title>
<style>
:root { color-scheme: light dark; --bg: #f2f2f7; --surface: #ffffff; --ink: #111114; --ink-2: #5c5c63; --sep: #d8d8de; }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --ink-2: #a1a1a8; --sep: #38383a; } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem 1rem; }
section { background: var(--surface); border-radius: 12px; padding: 0.25rem 1.25rem 1rem; margin: 0 0 1.5rem; }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 1rem 0 0.75rem; }
h2 { font-size: 1.2rem; margin: 1.75rem 0 0.5rem; }
a { color: inherit; }
ul { padding-left: 1.25rem; }
li { margin: 0.35rem 0; }
.lang { margin: 0 0 1rem; }
footer { max-width: 40rem; margin: 0 auto; padding: 0 1rem 2rem; color: var(--ink-2); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<p class="lang"><a href="#tieng-viet" lang="vi">Tiếng Việt</a></p>
<section id="english">
<h1>TapDay</h1>
<p>TapDay is a quick, quiet way to keep a log of your everyday life.</p>
<ul>
<li><a href="privacy/">Privacy policy</a></li>
<li><a href="support/">Support</a></li>
</ul>
</section>
<section id="tieng-viet" lang="vi">
<h1>TapDay</h1>
<p>TapDay là cách nhanh và nhẹ nhàng để ghi lại cuộc sống hằng ngày của bạn.</p>
<ul>
<li><a href="privacy/#tieng-viet">Chính sách quyền riêng tư</a></li>
<li><a href="support/#tieng-viet">Hỗ trợ</a></li>
</ul>
</section>
</main>
<footer><p>© 2026 Toan Vo</p></footer>
</body>
</html>
